[preferred]
default=hyprland;gtk
# Pin the wallpaper portal to the omarchy backend explicitly. Newer
# xdg-desktop-portal-gtk builds also implement org.freedesktop.impl.portal.Wallpaper;
# without this line gtk (listed first) would win and only write GNOME gsettings
# keys, which nothing renders on Hyprland.
org.freedesktop.impl.portal.Wallpaper=omarchy
